name: PR - Process Changed Packages

on:
  push:
    branches: [ "*" ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ "*" ]

jobs:
  # Job 1: Detect which packages have changed and output them as a JSON array
  detect-changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify Changes
        id: set-matrix
        run: |
          chmod +x ./scripts/changed-packages.sh
          # Get list, convert to JSON array using jq
          PACKAGES_JSON=$(./scripts/changed-packages.sh | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "packages=$PACKAGES_JSON" >> $GITHUB_OUTPUT
          echo "Detected packages: $PACKAGES_JSON"

  # Job 2: Run once for each package in the 'packages' array
  process-packages:
    name: Process Package (${{ matrix.package }})
    needs: detect-changes
    runs-on: ubuntu-latest
    # Only run if there are packages to process
    if: needs.detect-changes.outputs.packages != '[]' && needs.detect-changes.outputs.packages != ''
    strategy:
      # Maximize parallelization
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Task for ${{ matrix.package }}
        run: |
          echo "----------------------------------------"
          echo "Running workflow for package: ${{ matrix.package }}"
          echo "----------------------------------------"
          # Add your package-specific commands here, for example:
          # cd packages/${{ matrix.package }} && yarn install && yarn test
