name: PR - Process Changed Packages

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ "main" ]

env:
  BUCKET_NAME: ${{ secrets.CDN_BUCKET_NAME }}
  TYPE: ${{ github.event_name == 'pull_request' && 'draft' || 'prerelease' }}

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  detect-changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}
      comment_id: ${{ steps.create-comment.outputs.comment_id }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify Changes
        id: set-matrix
        run: |
          chmod +x ./scripts/changed-packages.sh
          PACKAGES_JSON=$(./scripts/changed-packages.sh | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "packages=$PACKAGES_JSON" >> $GITHUB_OUTPUT
          echo "Detected packages: $PACKAGES_JSON"

      - name: Create PR Comment
        if: github.event_name == 'pull_request'
        id: create-comment
        uses: actions/github-script@v7
        with:
          script: |
            const packages = JSON.parse('${{ steps.set-matrix.outputs.packages }}');
            if (packages.length === 0) return;
            const body = `### 🚀 Processing Changed Packages\n\nDetected changes in the following packages:\n${packages.map(p => `- ${p}`).join('\n')}\n\nUpdates will be appended below.`;
            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
            core.setOutput('comment_id', comment.id);

  process-packages:
    name: Build & Upload (${{ matrix.package }})
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.packages != '[]' && needs.detect-changes.outputs.packages != ''
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: test_app/yarn.lock

      - name: Run Task for ${{ matrix.package }}
        run: |
          cd packages/${{ matrix.package }}
          yarn install
          yarn build

      - name: Calculate GCS Destination
        run: |
          PATH_PREFIX="viz/${{ env.TYPE }}"
          
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            PATH_PREFIX="${PATH_PREFIX}/${{ github.event.pull_request.number }}"
          fi
          
          PATH_PREFIX="${PATH_PREFIX}/${{ matrix.package }}"
          echo "GCS_PATH_PREFIX=$PATH_PREFIX" >> $GITHUB_ENV
          echo "GCS_DESTINATION=${{ env.BUCKET_NAME }}/$PATH_PREFIX" >> $GITHUB_ENV

      - name: Upload frontend bundle to GCS tag
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          process_gcloudignore: false
          path: packages/${{ matrix.package }}/dist
          destination: ${{ env.GCS_DESTINATION }}
          parent: false
          headers: |-
            cache-control: no-cache

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Invalidate Cloud CDN
        run: |
          gcloud compute url-maps invalidate-cdn-cache ${{ secrets.CDN_URL_MAP }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --path=/${{ env.GCS_PATH_PREFIX }}/* \
            --async

      - name: Update PR Comment
        if: always() && github.event_name == 'pull_request' && (success() || failure())
        uses: actions/github-script@v7
        with:
          script: |
            const commentId = '${{ needs.detect-changes.outputs.comment_id }}';
            if (!commentId) return;
            const package = '${{ matrix.package }}';
            const status = '${{ job.status }}';
            const icon = status === 'success' ? '✅' : '❌';
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const action = status === 'success' ? 'is done' : `failed ([view logs](${runUrl}))`;
            
            const { data: comment } = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId
            });
            const newBody = `${comment.body}\n- ${icon} Package **${package}** ${action}`;
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: newBody
            });