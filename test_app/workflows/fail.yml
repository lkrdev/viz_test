name: Always Fail Review

# Configure the action to run on every push (commit) to any branch
on: [pull_request]

jobs:
  # Define a single job named 'failing_test'
  failing_test:
    # Specify the runner environment for the job
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    # Define the steps that the job will execute
    steps:
      - name: Checkout Repository
        # Use the standard action to get the code
        uses: actions/checkout@v4

      - name: Guarantee Failure
        # This step uses a shell command that is guaranteed to fail.
        # The 'exit 1' command exits the script with a status code of 1,
        # which GitHub Actions interprets as a failure.
        run: |
          echo "This action is designed to fail!"
          echo "Simulating a failing test or review process..."
          exit 1

      - name: Jules You Failed
        # This 'if' condition ensures this step ONLY runs if the job failed
        # (in this case, due to the previous 'mandatory_fail' step).
        if: failure()
        uses: peter-evans/create-or-update-comment@v4
        with:
          # The PR number is automatically available in the event context
          issue-number: ${{ github.event.pull_request.number }}
          # The body of the comment to post on the PR
          body: |
            @jules You Failed
